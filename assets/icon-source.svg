<svg viewBox="0 0 48 48" width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wm-bg" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b8cff" />
      <stop offset="1" stop-color="#8b5bff" />
    </linearGradient>
    <linearGradient id="wm-brush" x1="30" y1="12" x2="42" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd15b" />
      <stop offset="1" stop-color="#ff8f5b" />
    </linearGradient>
  </defs>
  <!-- 圆角背景底板，让图标在浏览器工具栏里更醒目、边缘更完整 -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#wm-bg)" />
  <!-- 画布：白色圆角浏览器窗口，寓意「网页」 -->
  <rect x="9" y="11" width="26" height="26" rx="4.5" fill="#fff" fill-opacity="0.96" />
  <!--浏览器标题栏 -->
  <rect x="9" y="11" width="26" height="6.5" rx="4.5" fill="#5b8cff" fill-opacity="0.16" />
  <circle cx="13" cy="14.2" r="1.15" fill="#5b8cff" />
  <circle cx="16.4" cy="14.2" r="1.15" fill="#8b5bff" fill-opacity="0.7" />
  <circle cx="19.8" cy="14.2" r="1.15" fill="#8b5bff" fill-opacity="0.45" />
  <!-- 画布上被「塑形」的内容块 -->
  <rect x="13" y="21.5" width="12" height="2.6" rx="1.3" fill="#5b8cff" fill-opacity="0.85" />
  <rect x="13" y="26.5" width="17" height="2.6" rx="1.3" fill="#8b5bff" fill-opacity="0.55" />
  <rect x="13" y="31.5" width="9" height="2.6" rx="1.3" fill="#8b5bff" fill-opacity="0.4" />
  <!-- 魔法塑形笔刷：斜插向画布，寓意「重塑网页」 -->
  <g>
    <rect x="30.4" y="7.5" width="5.2" height="19" rx="2.6" transform="rotate(38 33 17)" fill="url(#wm-brush)" />
    <path d="M40.6 31.2l-5.6-4.4 2.7-3.45.6 4.4a2.2 2.2 0 0 1-2.7 3.45z" fill="#fff" />
    <path d="M40.6 31.2l-5.6-4.4 2.7-3.45.6 4.4a2.2 2.2 0 0 1-2.7 3.45z" fill="#ff8f5b" fill-opacity="0.25" />
  </g>
  <!-- 笔尖闪光粒子 -->
  <path d="M42.5 32.6l.55 1.35 1.35.55-1.35.55-.55 1.35-.55-1.35-1.35-.55 1.35-.55z" fill="#ffe27a" />
</svg>
